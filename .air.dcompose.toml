root = "."
tmp_dir = "dist/dev/server"

[build]
cmd = "go build -o ./dist/dev/server/dcompose ./cmd/dcompose"
bin = "./dist/dev/server/dcompose"
include_dir = ["cmd/dcompose", "internal", "frontend"]
include_ext = ["go"]
include_file = ["go.mod", "go.sum"]
exclude_dir = ["dist", "frontend/app", "frontend/public", "frontend/tests", "frontend/node_modules", "frontend/exported", "frontend/dist"]
poll = true
poll_interval = 500
delay = 200
stop_on_error = true
send_interrupt = true
kill_delay = "1s"
