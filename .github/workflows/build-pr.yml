name: build-pr

permissions:
  contents: read

on:
  pull_request:
    branches:
      - master
      - dev
      - testing
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'

jobs:
  test:
    name: Run Tests & Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up tools
        uses: jdx/mise-action@v5
        with:
          install_args: go bun node golangci-lint

      - name: Locate Go caches
        id: go-cache
        run: |
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"

      - name: Cache Go dependencies and builds
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.go-cache.outputs.modules }}
            ${{ steps.go-cache.outputs.build }}
          key: ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go-cache.outputs.version }}-${{ github.job }}-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go-cache.outputs.version }}-${{ github.job }}-

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        env:
          NODE_ENV: development
        run: bun --cwd=$PWD/frontend/ install --frozen-lockfile

      - name: Run checks
        run: ./.githooks/pre-commit --all

      - name: Build frontend
        run: bun --cwd=$PWD/frontend/ run generate

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate Docker build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ github.workflow }}
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}
          provenance: false
