name: build

on:
  workflow_dispatch:
    inputs:
      build:
        description: Build native binaries and publish multi-arch images
        type: boolean
        default: true
      update_readme:
        description: Also sync DockerHub README
        type: boolean
        default: false
  push:
    branches: [dev, master, testing]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: read

env:
  REGISTRY: ${{ vars.REGISTRY }}
  BUILD_AMD64: ${{ vars.BUILD_AMD64 != 'false' && 'true' || 'false' }}
  BUILD_ARM64: ${{ vars.BUILD_ARM64 != 'false' && 'true' || 'false' }}
  DOCKERHUB_SLUG: arabcoders/dcompose
  GHCR_SLUG: ghcr.io/arabcoders/dcompose

jobs:
  validate-build-config:
    name: Validate Build Configuration
    if: github.event_name != 'workflow_dispatch' || inputs.build
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check enabled architectures
        run: |
          if [ "$BUILD_AMD64" = 'false' ] && [ "$BUILD_ARM64" = 'false' ]; then
            echo '::error::Enable at least one build architecture.'
            exit 1
          fi

  test:
    name: Run Checks & Prepare Frontend
    needs: validate-build-config
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          install_args: go bun node golangci-lint

      - name: Locate Go caches
        id: go-cache
        run: |
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"

      - name: Cache Go dependencies and builds
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.go-cache.outputs.modules }}
            ${{ steps.go-cache.outputs.build }}
          key: ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go-cache.outputs.version }}-${{ github.job }}-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go-cache.outputs.version }}-${{ github.job }}-

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        run: bun --cwd=$PWD/frontend/ install --frozen-lockfile

      - name: Run checks
        run: ./.githooks/pre-commit --all

      - name: Build frontend
        run: bun --cwd=$PWD/frontend/ generate

      - name: Upload frontend build (GitHub)
        if: env.REGISTRY == ''
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: frontend/exported/
          retention-days: 1

      - name: Upload frontend build (Gitea)
        if: env.REGISTRY != ''
        uses: ChristopherHX/gitea-upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/exported/
          retention-days: 1

  native-build:
    name: Build Native Binaries
    runs-on: ubuntu-latest
    needs: [test, validate-build-config]
    timeout-minutes: 20
    env:
      CGO_ENABLED: '0'
      GOOS: linux
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Download frontend build (GitHub)
        if: env.REGISTRY == ''
        uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: frontend/exported/

      - name: Download frontend build (Gitea)
        if: env.REGISTRY != ''
        uses: ChristopherHX/gitea-download-artifact@v4
        with:
          name: frontend-build
          path: frontend/exported/

      - uses: jdx/mise-action@v5
        with:
          install_args: go

      - name: Locate Go caches
        id: go-cache
        run: |
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"

      - name: Cache Go dependencies and builds
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.go-cache.outputs.modules }}
            ${{ steps.go-cache.outputs.build }}
          key: ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go-cache.outputs.version }}-${{ github.job }}-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go-cache.outputs.version }}-${{ github.job }}-

      - name: Build and package native binaries
        run: |
          architectures=()
          if [ "$BUILD_AMD64" = 'true' ]; then
            architectures+=(amd64)
          fi
          if [ "$BUILD_ARM64" = 'true' ]; then
            architectures+=(arm64)
          fi
          for arch in "${architectures[@]}"; do
            export GOARCH="$arch"
            for binary in dcompose dagent; do
              package_name="${binary}-linux-${GOARCH}-${VERSION//\//-}"
              mkdir -p "dist/$package_name/packaging/systemd" release
              build_args=()
              if [ "$binary" = 'dcompose' ]; then
                build_args+=(-tags embed)
              fi
              go build "${build_args[@]}" -trimpath -ldflags="-s -w -X main.version=$VERSION" -o "dist/$package_name/$binary" "./cmd/$binary"
              cp install.sh installation.md dcompose.example.toml dagent.example.toml compose.yaml README.md FAQ.md CONTRIBUTING.md SECURITY.md LICENSE "dist/$package_name/"
              cp packaging/README.md "dist/$package_name/packaging/"
              cp "packaging/systemd/$binary.service" "dist/$package_name/packaging/systemd/"
              (
                cd "dist/$package_name"
                sha256sum "$binary" > SHA256SUMS
                cd ..
                zip -yr "../release/$package_name.zip" "$package_name"
              )
            done
          done

      - name: Upload server amd64 build (GitHub)
        if: env.REGISTRY == '' && env.BUILD_AMD64 == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dcompose-linux-amd64
          path: release/dcompose-linux-amd64-*.zip

      - name: Upload agent amd64 build (GitHub)
        if: env.REGISTRY == '' && env.BUILD_AMD64 == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dagent-linux-amd64
          path: release/dagent-linux-amd64-*.zip

      - name: Upload server arm64 build (GitHub)
        if: env.REGISTRY == '' && env.BUILD_ARM64 == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dcompose-linux-arm64
          path: release/dcompose-linux-arm64-*.zip

      - name: Upload agent arm64 build (GitHub)
        if: env.REGISTRY == '' && env.BUILD_ARM64 == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dagent-linux-arm64
          path: release/dagent-linux-arm64-*.zip

      - name: Upload server amd64 build (Gitea)
        if: env.REGISTRY != '' && env.BUILD_AMD64 == 'true'
        uses: ChristopherHX/gitea-upload-artifact@v4
        with:
          name: dcompose-linux-amd64
          path: release/dcompose-linux-amd64-*.zip

      - name: Upload agent amd64 build (Gitea)
        if: env.REGISTRY != '' && env.BUILD_AMD64 == 'true'
        uses: ChristopherHX/gitea-upload-artifact@v4
        with:
          name: dagent-linux-amd64
          path: release/dagent-linux-amd64-*.zip

      - name: Upload server arm64 build (Gitea)
        if: env.REGISTRY != '' && env.BUILD_ARM64 == 'true'
        uses: ChristopherHX/gitea-upload-artifact@v4
        with:
          name: dcompose-linux-arm64
          path: release/dcompose-linux-arm64-*.zip

      - name: Upload agent arm64 build (Gitea)
        if: env.REGISTRY != '' && env.BUILD_ARM64 == 'true'
        uses: ChristopherHX/gitea-upload-artifact@v4
        with:
          name: dagent-linux-arm64
          path: release/dagent-linux-arm64-*.zip

  native-release:
    name: Publish Native Release
    runs-on: ubuntu-latest
    needs: native-build
    if: vars.REGISTRY == '' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download native builds
        uses: actions/download-artifact@v8
        with:
          pattern: '*-linux-*'
          merge-multiple: true
          path: release/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: release/*.zip
          fail_on_unmatched_files: true

  docker-build-amd64:
    name: Build Container (amd64)
    runs-on: ubuntu-latest
    needs: native-build
    if: vars.BUILD_AMD64 != 'false'
    permissions:
      contents: read
      packages: write
    env:
      ARCH: amd64
    steps:
      - uses: actions/checkout@v7

      - name: Download native builds (GitHub)
        if: env.REGISTRY == ''
        uses: actions/download-artifact@v8
        with:
          pattern: '*-linux-${{ env.ARCH }}'
          merge-multiple: true
          path: native/

      - name: Download native builds (Gitea)
        if: env.REGISTRY != ''
        uses: ChristopherHX/gitea-download-artifact@v4
        with:
          pattern: '*-linux-${{ env.ARCH }}'
          merge-multiple: true
          path: native/

      - name: Extract container binaries
        run: |
          unzip -j native/dcompose-linux-*.zip '*/dcompose' -d binaries
          unzip -j native/dagent-linux-*.zip '*/dagent' -d binaries

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            name=${{ env.DOCKERHUB_SLUG }},enable=${{ env.REGISTRY == '' }}
            name=${{ env.GHCR_SLUG }},enable=${{ env.REGISTRY == '' }}
            name=${{ env.REGISTRY }}/${{ github.repository }},enable=${{ env.REGISTRY != '' }}
          flavor: |
            latest=false
            suffix=-${{ env.ARCH }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Login to private registry
        if: env.REGISTRY != ''
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GIT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Login to GHCR
        if: env.REGISTRY == ''
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        if: env.REGISTRY == ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ env.ARCH }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BINARY_SOURCE=prebuilt
          cache-from: type=gha,scope=container-${{ github.ref_name }}-${{ env.ARCH }}
          cache-to: type=gha,mode=max,scope=container-${{ github.ref_name }}-${{ env.ARCH }}
          provenance: true

  docker-build-arm64:
    name: Build Container (arm64)
    runs-on: ubuntu-latest
    needs: native-build
    if: vars.BUILD_ARM64 != 'false'
    permissions:
      contents: read
      packages: write
    env:
      ARCH: arm64
    steps:
      - uses: actions/checkout@v7

      - name: Download native builds (GitHub)
        if: env.REGISTRY == ''
        uses: actions/download-artifact@v8
        with:
          pattern: '*-linux-${{ env.ARCH }}'
          merge-multiple: true
          path: native/

      - name: Download native builds (Gitea)
        if: env.REGISTRY != ''
        uses: ChristopherHX/gitea-download-artifact@v4
        with:
          pattern: '*-linux-${{ env.ARCH }}'
          merge-multiple: true
          path: native/

      - name: Extract container binaries
        run: |
          unzip -j native/dcompose-linux-*.zip '*/dcompose' -d binaries
          unzip -j native/dagent-linux-*.zip '*/dagent' -d binaries

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            name=${{ env.DOCKERHUB_SLUG }},enable=${{ env.REGISTRY == '' }}
            name=${{ env.GHCR_SLUG }},enable=${{ env.REGISTRY == '' }}
            name=${{ env.REGISTRY }}/${{ github.repository }},enable=${{ env.REGISTRY != '' }}
          flavor: |
            latest=false
            suffix=-${{ env.ARCH }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Login to private registry
        if: env.REGISTRY != ''
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GIT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Login to GHCR
        if: env.REGISTRY == ''
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        if: env.REGISTRY == ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ env.ARCH }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BINARY_SOURCE=prebuilt
          cache-from: type=gha,scope=container-${{ github.ref_name }}-${{ env.ARCH }}
          cache-to: type=gha,mode=max,scope=container-${{ github.ref_name }}-${{ env.ARCH }}
          provenance: true

  docker-publish-manifest:
    name: Publish multi-arch manifest
    runs-on: ubuntu-latest
    needs: [docker-build-amd64, docker-build-arm64]
    if: |
      !cancelled() && !failure() &&
      (needs.docker-build-amd64.result == 'success' || needs.docker-build-arm64.result == 'success')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            name=${{ env.DOCKERHUB_SLUG }},enable=${{ env.REGISTRY == '' }}
            name=${{ env.GHCR_SLUG }},enable=${{ env.REGISTRY == '' }}
            name=${{ env.REGISTRY }}/${{ github.repository }},enable=${{ env.REGISTRY != '' }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Login to private registry
        if: env.REGISTRY != ''
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GIT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Login to GHCR
        if: env.REGISTRY == ''
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        if: env.REGISTRY == ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Create and push manifests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            images=()
            if [ "$BUILD_AMD64" = 'true' ]; then
              images+=("${tag}-amd64")
            fi
            if [ "$BUILD_ARM64" = 'true' ]; then
              images+=("${tag}-arm64")
            fi
            docker buildx imagetools create --tag "$tag" "${images[@]}"
          done <<< "$TAGS"

  dockerhub-sync-readme:
    name: DockerHub README sync
    runs-on: ubuntu-latest
    if: |
      vars.REGISTRY == '' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
       (github.event_name == 'workflow_dispatch' && inputs.update_readme))
    steps:
      - uses: docker://lsiodev/readme-sync:latest
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
          GIT_REPOSITORY: ${{ github.repository }}
          DOCKER_REPOSITORY: ${{ env.DOCKERHUB_SLUG }}
          GIT_BRANCH: master
        with:
          entrypoint: node
          args: /opt/docker-readme-sync/sync
