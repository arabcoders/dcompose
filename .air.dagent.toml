root = "."
tmp_dir = "dist/dev/agent"

[build]
cmd = "go build -o ./dist/dev/agent/dagent ./cmd/dagent"
bin = "./dist/dev/agent/dagent"
include_dir = ["cmd/dagent", "internal"]
include_ext = ["go"]
include_file = ["go.mod", "go.sum"]
exclude_dir = ["dist"]
poll = true
poll_interval = 500
delay = 200
stop_on_error = true
send_interrupt = true
kill_delay = "1s"
